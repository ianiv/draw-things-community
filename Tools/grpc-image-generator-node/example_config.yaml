# Example Draw Things gRPC Image Generator Configuration
# Copy this to config.yaml and customize for your setup

server:
  host: localhost
  port: 50051
  shared_secret: null  # Set if your server requires authentication

generation:
  # Model settings
  model: v1-5-pruned-emaonly.ckpt  # Model checkpoint file name

  # Image dimensions
  start_width: 512
  start_height: 512

  # Generation parameters
  steps: 20                    # More steps = better quality, slower
  guidance_scale: 7.5          # How closely to follow the prompt (1-20)
  sampler: dpmpp_2m_karras     # Sampling algorithm
  seed: 42                     # Random seed (use same seed for reproducible results)

  # Batch settings
  batch_count: 1               # Number of batches to generate
  batch_size: 1                # Images per batch

  # Advanced settings
  clip_skip: 1                 # CLIP layers to skip (1-2 for most models)
  strength: 0.75               # Denoising strength for img2img

  # High-resolution fix (2-pass generation for better quality)
  # hires_fix: true
  # hires_fix_start_width: 512
  # hires_fix_start_height: 512
  # hires_fix_strength: 0.7
  # upscaler: RealESRGAN_x4plus_anime_6B.pth

  # Post-processing
  # face_restoration: GFPGANv1.4.pth

  # SDXL Refiner (for SDXL models)
  # refiner_model: sd_xl_refiner_1.0.ckpt
  # refiner_start: 0.7

  # Inpainting
  # mask_blur: 8.0

  # Advanced diffusion settings
  # shift: 1.0                 # Timestep shift (for Flux/SD3 models)

  # LoRA weights (add style/character modifications)
  # loras:
  #   - file: add_detail.safetensors
  #     weight: 0.8
  #   - file: anime_style.safetensors
  #     weight: 0.6

  # ControlNet (guided generation)
  # controls:
  #   - file: control_v11p_sd15_canny.ckpt
  #     weight: 1.0
  #     guidance_start: 0.0
  #     guidance_end: 1.0
  #     control_mode: 0  # 0=Balanced, 1=Prompt, 2=Control

output:
  directory: output            # Where to save generated images
  show_progress: true          # Display generation progress
